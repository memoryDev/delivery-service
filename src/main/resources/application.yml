spring:
  profiles:
    active: local
    include: secret

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

# JWT
jwt:
  secret: mMrR2nUtBHD4y1T9clt7yMdh6SFsgVf1TWDLMLZcDOQ
  access-expiration: 1800000     # 30분 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Logging
logging:
  level:
    com.delivery: DEBUG
    org.hibernate.SQL: DEBUG